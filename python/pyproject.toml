[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "patet"
version = "0.4.0"
description = "PATET: the line language an AI writes to build and edit a screen. The board, the parser and the serializer, with no dependencies."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
dependencies = []
keywords = ["ai", "agent", "generative-ui", "protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/fidenit/patet"

[project.scripts]
patet = "patet.__main__:main"

[tool.setuptools]
packages = ["patet"]

[tool.setuptools.package-data]
patet = ["py.typed"]
